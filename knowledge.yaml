  - 谁: 美国海关与边境保护局（U.S. CBP，索尔思台湾 N359369 裁定）
    原话: In China, the main PCBA is manufactured using surface mount technology. ... The optical sub-assembly (OSA) is manufactured in Taiwan. ... the character of this product is imparted by the main PCBA which is considered the dominant component of this assembly ... the country of origin for purposes of applying trade remedies under Section 301 will be China.
    出处: CBP CROSS N359369（2026-03-17）·正文工序事实与 Section 301 原产地结论段
