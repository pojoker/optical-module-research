- id: KN013
  格: [M1, C1, D7, MOD1]
  标题: 中国两用物项许可与智算互连技术出境合规——分清“管货物许可证”与“管万卡集群技术登记”
  一句话: |
    国内出境合规是两条并行的法律轨道：一条管实物货品（如磷化铟衬底、涉特定指标的精密光学镜片，未办两用物项出口许可证直接涉刑责）；另一条管技术转让与授权（商务部、科技部 2026 年第 48 号公告对超万张加速卡集群、双向带宽 ≥800 GB/s 的互连技术征求意见并实施出口前临时登记，不是管单只 800G 光模块的日常货物出口）。
  说细点: |
    光通信产业链出境合规不能笼统写成“光电产品全面受限”，必须把《出口管制法》下的两用物项货物许可与《技术进出口管理条例》下的技术出口管理拆开核对：

    **第一条轨道：技术出境管理（商务部、科技部 2026 年第 48 号公告，2026-10-16 发布）**。
    该公告就修订《中国禁止出口限制出口技术目录》（拟增列人工智能、生物医药、光伏三领域 40 项技术）公开征求意见至 2026-11-15——注意政策阶段是“公开征求意见”，尚未作为正式修订目录颁布；但公告第三节同步要求，自发布之日起至新目录正式实施前，出口附件所列技术（指知识产权转让、境内技术授权境外使用、实控人变更为境外主体等技术贸易行为）须在商务部系统办理**出口前临时登记**，且“已经开始但尚未办结（原文：尚未完成）的出口”也在登记范围内。
    其中附件 1 人工智能限制出口部分第 11 项（编号 `266507X`，人工智能算力集群技术）控制要点 1 为：“用于大规模智能算力集群的片间或节点间高速互连技术，双向带宽 ≥800 吉字节每秒（GB/s）”，文末注释明确定义“大规模智能算力集群”指**人工智能加速卡总数超过 10,000 张**的运算主体。这里有两个关键数字不能搞混：一是单位为吉字节每秒（`GB/s`，1 字节 = 8 比特，800 GB/s 折合 6,400 Gbps），不是单只 800G（800 Gbps）可插拔光模块的端口速率；二是管控标的是向境外转让或授权万卡集群高速互连技术，而非正常报关销售标准光模块成品。

    **第二条轨道：两用物项实物出口许可（波长光电公诉案与磷化铟衬底出口许可互参）**。
    只要实物产品落入《两用物项出口管制清单》技术指标，出口每一批货物都必须事先向商务部申领两用物项出口许可证：
    ① **反面司法实证（光学元件 D7）**：波长光电（`301421`）于 2026-10-08 披露《关于公司收到起诉书的公告》（2026-037），上海市人民检察院第三分院出具沪检三分刑诉〔2026〕176 号起诉书，指控公司及相关人员于 2023 年 8 月至 2025 年 4 月期间未按规定办理两用物项出口许可证，出口涉案光学镜片金额达人民币 `20,108,512.11 元`（约 `2,010.85 万元`），以涉嫌走私国家禁止进出口的货物罪提起公诉（截至披露日处于公诉起诉阶段，尚未审理宣判）。
    ② **正面经营互参（磷化铟衬底 M1）**：上游激光器与探测器芯片核心衬底磷化铟（InP）受两用物项出口许可管理。云南锗业（`002428`，子公司云南鑫耀对应 `P202`）在 2026-11-10 投资者关系活动记录表中明确披露，云南鑫耀 6 英寸磷化铟晶片海外头部客户在手订单约 1.3 万片（合计约 3 亿元人民币），“目前，已有部分订单取得出口许可，并处于持续交付中”。这说明对受管制上游材料与精密光学件而言，“签下海外订单”与“拿到商务部出口许可证实现合规出货”之间隔着一道硬性行政许可闸门。
  怎么用它判断: |
    评估国内出口管制对一家光通信公司的影响时，按以下三条清单核对：
      ① 先分清交易性质是“卖硬件货品”还是“向境外做技术转让/知识产权授权/跨境实控人变更”——第 48 号公告 `266507X` 管的是万卡集群（>10,000 张加速卡）且双向带宽 ≥800 GB/s 的高速互连技术出境登记，不能直接套用到普通 800G 光模块成品买卖；
      ② 对磷化铟衬底（M1）、碲化镉/锗材料、特定指标激光器（C1）与精密光学镜片（D7）等硬件出口，不能只看在手订单金额，必须核验公司是否披露“取得两用物项出口许可证”及实际报关交付节奏；
      ③ 遇到涉两用物项刑事或行政案件披露（如波长光电案），严格锁定公告载明的诉讼阶段（公诉起诉 vs 生效判决）与涉案期间，不得在缺管制编码和判决书前外推为全行业普适禁令。
  证据:
  - 谁: 中国商务部、科技部（2026 年第 48 号公告正文）
    原话: 根据《中华人民共和国对外贸易法》和《中华人民共和国技术进出口管理条例》，商务部、科技部拟修订《中国禁止出口限制出口技术目录》，增列部分人工智能、生物医药、光伏技术。经批准，现向社会公开征求意见，并同步对相关技术实施出口前登记管理。
