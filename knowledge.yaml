- id: KN011
  格: [MOD1, MOD2, MOD3, D12]
  标题: 美国海关光模块原产地怎么判——主电路板表面贴装在哪国做，比最后在哪国刷固件、装光组件更关键
  一句话: |
    美国海关与边境保护局（CBP）按“实质性转变”判断光模块原产地时，四份公开裁定共同把“主印刷电路板组件（主 PCBA）在哪国经表面贴装（SMT）制成”当成决定性标尺：主电路板在中国贴装的，哪怕去泰国刷固件调测、甚至去台湾做光芯片与光学对准，仍判中国原产；主电路板在泰国或马来西亚贴装的，哪怕送回中国贴光收发组件再返当地总装，也判泰国或马来西亚原产。
  说细点: |
    一颗高速光收发模块内部主要由两大块组成：一块是焊有数字信号处理芯片（DSP）、微控制器及数百颗阻容元件的主印刷电路板组件（主 PCBA），另一块是负责电光与光电转换的光收发子组件（OSA，含发射组件 TOSA 与接收组件 ROSA）。美国对华加征 301 条款关税是否适用，取决于美国海关认定的“原产地”，而不是发货港或工厂注册地。

    四份已公开的美国海关原产地裁定把正反边界划得非常清楚：

    **两宗判“中国原产”的反例**：
    ① 新易盛个案（HQ H335829，2025-02-26，涉 100G–800G 收发器与有源光缆）：中国境内做完主电路板表面贴装、光组件贴片打线、整机空白模块装配与冷热循环，运往泰国只做固件烧录、参数调谐、老化、终测与包装。海关认定物理制造与功能骨架已在中国确立，泰国工序未带来名称、特征或用途改变，原产地仍为中国。
    ② 索尔思台湾个案（N359369，2026-03-17，涉 800G 2×FR4 与 400G DR4/FR4 三款模块）：这宗裁定更严苛——即便光芯片制造、光组件封装及光学对准工序放在台湾进行，只要承载 DSP 与控制电路的主电路板是在中国经表面贴装制成，海关仍认定主电路板是赋予产品本质特征的主导部件（dominant component），台湾工序未改变主电路板最终用途，301 关税项下原产地依旧判为中国。

    **两宗判“非中国原产”的正例**：
    光迅科技申报的两宗 800G OSFP DR8 裁定（N344720，2025-01-13 判泰国；N358465，2026-02-27 判马来西亚）：主电路板（含美系 DSP 等约 560 颗电子元器件，占全模块超四分之三零件）分别在泰国、马来西亚经锡膏印刷、贴片、回流焊、三维 X 光检测等多道表面贴装工序制成，随后寄回中国贴装硅光发射/接收组件、打线并对准透镜与光纤阵列，最后再运回泰国或马来西亚总装外壳、灌装软件与终测。海关认定泰、马制造的主电路板赋予了产品本质特征，后续中国光路贴装未对其产生实质性转变，故进口美国时原产地分别为泰国、马来西亚，不适用对华 301 关税。

    此外还要分清关税缓冲窗口：美国贸易代表办公室（USTR）于 2026-11-06 公告将既有 178 项对华 301 产品排除延长至美东时间 2027-01-09 23:59；商务部确认第八轮中美经贸磋商将吉隆坡联合安排延期至 2027-01-10，国务院关税税则委员会自 2026-11-10 13:01 起两个月内继续暂停实施 24% 对美加征关税、保留 10%（白宫 2026-02-20 终止部分《国际紧急经济权力法》额外关税的执行令与 301 关税分属不同法源，不可混算）。
  怎么用它判断: |
    看到“某光模块厂在东南亚有超级工厂，因此彻底规避美国关税”的说法时，按三步核验：
      ① 查具体型号的主电路板（含 DSP 的核心 PCBA）表面贴装（SMT）究竟在哪国进行，不能只看光耦合、总装、老化或买地建厂披露；
      ② 认准每份美国海关裁定末尾的法定限制（19 CFR § 177.9(b)(1)）：裁定仅对申报书所载特定型号与工序事实有效，不等于整座海外工厂或同公司其他批次的通用免税证；
      ③ 若原产地仍属中国，再逐项核对进口当日有效的美国协调关税表（HTSUS）第 99 章排除编码与美东 2027-01-09 23:59 窗口，缺型号级海关编码时一律标待核（UNKNOWN）。
  证据:
  - 谁: 美国海关与边境保护局（U.S. CBP，新易盛 HQ H335829 裁定）
    原话: In this case, the entirety of the physical manufacturing and assembly of the optical transceiver devices occurs in China. ... Based on the information provided, we find that the country of origin of the subject optical transceiver units is China.
    出处: CBP CROSS HQ H335829（2025-02-26）·LAW AND ANALYSIS 及 HOLDING
    锚型: web_snapshot
    锚:
      原URL: https://rulings.cbp.gov/api/ruling/H335829
