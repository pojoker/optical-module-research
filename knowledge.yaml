- id: KN007
  格: [EQ4, P1, EQ7]
  标题: 光模块封装三件事——贴片、耦合、老化；耦合工时最长、最容易出废品
  一句话: |
    芯片贴好后要"对光"（耦合）：让激光器发出的光精确射进光纤。这是光模块封装里
    工时最长、最容易产生不良品的一步。最后还要长时间"烤机"（老化测试）筛掉早夭品。
  说细点: |
    猎奇智能（光模块封测设备厂）的招股书把这三步讲得最清楚：

    **耦合**："耦合是光模块封装工时最长、最易产生不良品的步骤，它直接影响光模块的性能。"
    流程是：对准 → 透镜耦合 → 胶水固定 → 验证耦合效率。激光器发的光要经过微透镜
    准直聚焦后才能最大限度进入光纤——位置差一点，光就漏掉一截，模块性能直接打折。
    所以耦合设备的核心是高精密运动平台+视觉引导。说“精度”要分清三个不同的物理量，不能互换：
    ①最小运动增量（电机最轻推一下能走的最小步长）：招股书行业段说“部分国产厂商……耦合设备已能达到
      最小运动增量 50nm”（第五节，1-1-122，第 9759–9760 行，主语是行业而非猎奇自述），技术门槛段说
      光学器件位姿“调整最小运动增量达 50-100nm”（1-1-129，第 9984 行）；
    ②分辨率（相当于尺子的最小刻度）：猎奇 10 纳米 vs ficonTEC 5 纳米；
    ③重复定位精度（反复回到同一个点的误差）：猎奇 ±0.05 微米（=±50 纳米）vs ficonTEC ±0.02 微米（=±20 纳米）。
    ②③都出自猎奇招股书自己的竞品参数表（第五节，1-1-146，第 10760–10784 行）——ficonTEC 两项都高约 2～2.5 倍。
    刻度细、步子小，不等于每次都能扎准同一个点。

    **老化**："老化测试是光模块生产的核心工序之一，贯穿光模块生产的全过程"——
    芯片阶段测电流-功率-电压和光谱，装到载体上再老化一轮，成品模块还要再老化一轮。
    目的是用高温通电模拟长期使用，把会早夭的品挑出来，别让它出厂。不过和前面拼亚微米
    精度的贴片机、耦合机比起来，老化测试设备的工艺门槛与盈利稳定性明显弱一截：猎奇智能
    招股书披露，2023—2025 年其贴片设备毛利率稳在 59.28%～60.51%，耦合设备稳在 53.99%～60.45%，
    唯独老化测试设备毛利率从 2023 年的 37.45%、2024 年的 50.65% 塌缩至 2025 年的 12.55%
    （公司解释主要是模块老化测试设备当期改型导致平均单位成本上升，第六节，1-1-228，第 18210–18222 行）——
    同样造封测设备，老化环节一旦遇上改型与定制波动，毛利率弹性远不如贴片与耦合。

    这解释了结构图上为什么设备层单独有"耦合设备"（EQ4）和"测试/老化"（EQ7）两个格子：
    它们是光模块区别于普通电子组装的两道专属工序，设备市场也因此独立存在。
  怎么用它判断: |
    "耦合"是个泛词（电路耦合/耦合电容满天飞），判定时认这三个特征之一：
    光学耦合语境、透镜/光纤对准语境、耦合设备+运动平台/视觉语境。
    老化同理：认"老化测试+光模块/芯片筛选"语境，不认材料老化。
  证据:
  - 谁: 猎奇智能
    原话: 耦合是光模块封装工时最长、最易产生不良品的步骤，它直接影响光模块的性能。耦合的目的是将光高效高质的从一端耦合进入到另一端，耦合的流程一般为：对准、透镜耦合、胶水固定、验证耦合效率
    出处: 招股说明书（申报稿）·主营业务
