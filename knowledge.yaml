- id: KN012
  格: [MOD1, MOD2, B1]
  标题: 美国 FCC 设备授权与国会 S.5548 提案边界——分清生效规则、受管制清单与待审法案
  一句话: |
    截至 2026 年 11 月，美国联邦通信委员会（FCC）已生效的 26-50 号规则只拦截“采用受管制清单（Covered List）已列名实体所造逻辑硬件组件”的新设备授权，一般商用光模块并未被列入该清单，更不存在所谓“3.2T 禁令”或“65% 美国物料红线”成文法条；参议院 S.5548 法案则仅属委员会待审的联邦政府关键系统远期采购提案。
  说细点: |
    市场上常把行政设备授权、受管制清单、国会提案与投行/媒体传闻混成一句“美国禁中国光模块”，回到四类官方一手文本可以逐层拆清：

    **第一层：已于 2026-10-13 生效的 FCC 26-50 最终规则（91 FR 57798，修订 47 CFR § 2.903(b)(2)）**。
    该条规制的是“含逻辑功能硬件组件”（产生并使用每秒超 9,000 次脉冲且采用数字技术的模块、子组件或集成电路）的新设备授权申请，但触发禁批必须同时满足两项法定前提：一是该逻辑组件由**已被列入 FCC 受管制清单（Covered List）的实体**生产；二是假使该实体生产整台设备，整机原本就会依 § 2.903(a) 被禁止获批。FCC 26-50 原文脚注 245 明确写明，Coherent 与中际旭创等光模块市场主要厂商均不在 Covered List 上；全文检索“3.2T”命中为 0，“65%”仅在同份文件后半段“第三次进一步拟议规则公告（Third FNPRM）”征求意见时援引联邦采购法（48 CFR 25.101(a)(1)）讨论无人机等“外国生产”定义选项时出现 2 次，绝非针对光模块的生效法令。

    **第二层：FCC 受管制清单（Covered List）官方快照（DA 26-1130A1 / DA 26-1203A1）**。
    核查 2026-10-21 完整受管制清单附录（DA 26-1130A1）及 2026-11-06 条件批准更新公告（DA 26-1203A1，涉及无人机、路由器、先进机器人与电力逆变器四类），全文“transceiver（收发器）”命中均为 0，商用光收发器未被单列为受限品类。

    **第三层：国会参议院 S.5548 提案（2026-09-24 提出）**。
    S.5548（《2026 年保护国家安全系统免受中国光收发器影响法案》）拟修订 2023 财年国防授权法第 5949 节，禁止美国联邦行政机构为“关键系统”采购特定受限光收发器（非关键系统明确豁免），且法条明文规定禁令在**法案正式成法 5 年后**才生效。国会官方状态 XML（BILLSTATUS）显示，该案自 2026-09-24 宣读两次并转交参议院国土安全与政府事务委员会后，无任何委员会表决或两院通过记录，也不直接约束北美商业云厂商的私营数据中心采购。至于 2026 年 11 月中旬外媒关于北美六家科技企业赴白宫游说及潜在规则起草的报道，在未见联邦公报或 FCC 新签发正式命令前，只能归入政策动向跟踪，不能当作既成法规事实。
  怎么用它判断: |
    遇到涉及美国光模块准入的政策消息时，先问三个问题分流定性：
      ① 引用的文件是已刊登生效的《联邦公报》终局规则（47 CFR 正文），还是仍在征求意见的拟议规则（FNPRM），抑或仅是投行情景推演与媒体匿名信源报道？
      ② 目标厂商或光模块品类是否真实出现在最新一期 FCC Covered List 官方附录上？（未上榜则不触发 § 2.903(b)(2) 组件禁批。）
      ③ 若引用国会法案（如 S.5548 或国防授权法条款），管辖对象是“联邦政府/国防部采购”还是“全美私营商业市场”，是否已过两院表决与总统签署，法定过渡期是几年？
    同时注意把政策传闻与发行人经营事实剥离核验（如景旺电子 P031 已在 2026 半年报披露批量交付 800G、1.6T 光模块印制电路板，不应与 S.5548 传闻混绑）。
