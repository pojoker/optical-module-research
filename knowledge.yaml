- id: KN014
  格: [C5, EQ7, MOD1, MOD2]
  标题: 美国 BIS 出口管制与欧盟 EED 能效指令——逐笔四要素审查与数据中心 PUE 报送，都不是光模块一刀切禁购令
  一句话: |
    美国商务部工业与安全局（BIS）《出口管理条例》（EAR）并无“凡光模块总带宽达某速率即禁运电芯片”的统一红线，而是按物项编码、目的地、最终用途和最终用户四要素逐笔判定许可；欧盟《能效指令》（EED）现行生效的则是装机 IT 功率 ≥500kW 数据中心的年度能效报送与 PUE 评级程序，最低绩效标准尚在公开征询，并不存在“法定强制采购 LPO/NPO 光模块”的条款。
  说细点: |
    在跨国供应链与下游合规解读里，最常见的两类过度外推是把“美国芯片出口管制”说成按模块速率一刀切，以及把“欧盟数据中心能效披露”直接等同于强制采购特定低功耗光模块。核对美欧一手法规文本可见：

    **一、美国 BIS EAR § 734.9（外国直接产品规则 FDPR）与 Part 744 的四要素逐笔机制**。
    `15 CFR § 734.9` 导言明确指出：即便某一境外制造物项因使用了受管控软件或设备而落入 EAR 管辖范围（subject to the EAR），“并非所有涉及受 EAR 管辖境外制造物项的交易都需要许可证”，必须针对具体交易分别评估四项要素——**物项分类编码（item classification，即 ECCN）、目的地（destination）、最终用途（end-use）与最终用户（end-user）**。`Part 744` 下属的 `§ 744.23`（特定超级计算机与半导体制造最终用途）、`§ 744.24`（受关注目的地与终端用户的数据中心最终用途）及补编 4 实体清单（Entity List），均围绕特定算力芯片/设备技术参数与受限主体名单运作。对光模块上游高速数字信号处理芯片（DSP，C5）及高速误码仪/采样示波器（EQ7）而言，合规边界取决于具体芯片或仪表的 ECCN 分类及买方是否触碰实体清单或受限超算/数据中心最终用途，法规中并不存在以“800G/1.6T 光模块总速率”直接划定的普遍禁运红线。

    **二、欧盟《能效指令》（EED 2023/1791）第 12 条与数据中心 PUE 法规的三阶段分界**。
    ① **已生效的年度信息报送义务**：指令 `(EU) 2023/1791` 第 12 条与欧委会授权法规 `(EU) 2024/1364` 要求已装机信息技术（IT）功率需求达到 `500 kW 及以上`的数据中心向欧洲数据库报送年度能效数据，并按设施总能耗除以 IT 设备能耗计算电能利用效率（`PUE = E_DC / E_IT`），同时包含水利用效率（WUE）、能源再利用系数等指标——这是**强制报送数据**，不是全欧统一淘汰红线。
    ② **审查中的评级标签程序**：欧委会于 2026 年 9 月通过的通用评级授权法规文本 `C(2026) 3472` 设立 PUE 与 WUE 评级分档，按欧委会 2026-09-22 官方通稿正处于欧洲议会与理事会 **2 个月审查期**，首批单个数据中心可持续性标签预计在 **2027 年**展示。
    ③ **尚在征询的最低能效绩效标准（MPS）**：欧委会能源总司于 `2026-09-21` 启动数据中心最低绩效标准公开征询（反馈截止 `2026-12-14`），正式立法提案计划在 **2027 年第二季度**才提出。因此，“机房降功耗压力利好线性直驱（LPO）、近封装光学（NPO）或高能效硅光方案”属于合理的工程与商业推论，但绝不能改写成“欧盟指令已强制考核 PUE 达标线并法定强制采购某类光模块”。
  怎么用它判断: |
    读到涉及美方芯片断供或欧方绿色法规的研报主张时，按两条标尺纠偏：
      ① 涉及 BIS EAR 管制 DSP 电芯片（C5）或测试仪表（EQ7）时，必须追问具体型号的 ECCN 编码、收货方是否在 Entity List 上、终端机房是否触发 § 744.23/§ 744.24 特定最终用途；缺失这四要素的笼统“高速带宽禁令”一律降级为待核背景；
      ② 涉及欧盟 EED / PUE 政策时，严格区分“≥500kW 数据中心年度数据报送（已生效）”“PUE/WUE 评级标签（议会审查中，预计 2027 年贴标）”与“最低能效准入门槛（公开征询中，拟 2027Q2 提案）”三个阶段，并把“降功耗需求拉动 LPO/NPO 选型”标为工程经济推论而非法律强制义务。
