  title: 整理日更知识库并同步 GitHub
  status: publishing
  authorization: 用户于2026-11-07要求整理光模块日更后的知识库上传GitHub并提供地址。
objective:
- 在现有dev分支提供可浏览的日更资料、来源、候选及已存在正式知识的导航。
allowed_write_paths:
- docs/control/ACTIVE_WORKPACK.yaml
- README.md
- knowledge-daily/**
read_scope:
- 当前项目入口和README、当前日更生产输出、现有dev发布基线及本轮隔离目录。
non_goals:
- 不改原工作目录、采集任务、main、正式账本，不晋升候选、不新建PR、不部署网站。
- 不读取archive、closure或旧会话轨迹；不上传凭据、日志和私人运行标识。
canonical_policy:
  writable: false
acceptance_criteria:
- 日期覆盖与缺失明确，候选不冒充事实，来源和导航可用。
- 检查格式、脱敏、相关机器门，远端提交回读验证。
authorized_external_actions:
- 将整理后的光模块研究材料推送至现有pojoker/optical-module-research仓库dev分支。
