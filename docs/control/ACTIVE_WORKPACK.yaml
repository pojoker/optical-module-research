# ACTIVE_WORKPACK — 当前唯一工作包（人工控制，无自动状态机）

workpack:
  id: REMEDIATE-DQ-001
  title: 四路关灯工场数据语义修复与产品方向复核
  status: in_progress
  approved_at: 2026-09-04
  owner: 用户
  authorization: 用户明确要求基于三方审计制定外包方案，由 CodeBuddy/OpenCode/Pi/AGY 开发，Codex 集成审核，再由 Kimi K3 与 Cursor Fable 5.1 复核

objective:
  - 修复审计已确认的读者侧语义误导和派生层合同错误，不修改 canonical 数据。
  - 通过四个隔离 worktree 并行实现四个互不重叠的低风险切片。
  - 集成后由 Codex 审核代码、测试与产品语义，并形成当前产品方向报告。
  - 由 Kimi K3 与 Cursor Fable 5.1 对集成结果和方向报告独立复核。

baseline:
  repository: pojoker/optical-module-research
  branch: main
  commit: 7ff3b25cfd0ff3b13fa834a0d775ae2879195
  audit_as_of: 2026-09-04

