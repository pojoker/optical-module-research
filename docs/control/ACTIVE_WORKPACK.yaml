  opencode: omen-alpha（启动前以本机模型列表确认精确 ID，不得静默替代）
  pi: glm-5.3-flash（启动前确认 provider/model）
  agy: gemini-3.8-flash（启动前确认精确 ID）
  kimi_reviewer: kimi-k3（启动前确认精确 alias）
  cursor_reviewer: fable-5.1（启动前确认精确 ID）

execution_order:
  - 固定基线并建立外包方案
  - 建立四个隔离 worktree 和 cmux 可视窗格
  - 四路并行开发并各自提交
  - Codex 逐分支代码审核、运行测试并选择性集成
  - 生成 reader outputs 并执行全仓机器门
  - Codex 输出产品方向与理解报告
  - Kimi K3 与 Cursor Fable 5.1 独立复核报告
  - 汇总分歧与 UNKNOWN，等待用户决定是否推送

non_goals:
  - 不修改任何 canonical 数据
  - 不拆分 C5/M1/MOD1 或新增关系类型
  - 不合并海外 sources/claims 与 event 链 schema
  - 不删除 canonical/legacy 表或执行真正消融
  - 不新增状态机、receipt、manifest、snapshot lineage 或自动 close/reopen
  - 不自动提交到远端、合并 PR 或推送 main
  - 不把机器门通过表述为领域结论完成

acceptance_criteria:
  - 四个开发分支从同一基线建立且写入范围互不重叠。
  - 每个切片有针对性测试，并明确 reader-visible 行为变化。
  - Codex 审核未发现越级推导、canonical 写入或无依据 schema 扩张。
  - 集成后 scan/render/participation/calls 机器门和站点测试通过。
  - 产品方向报告区分已修复、仍属数据问题、需架构裁决和 UNKNOWN。
  - Kimi 与 Cursor 复核完成前互不读取对方报告。

architecture_budget:
  new_relation_types: []
  new_state_machines: []
  new_canonical_schemas: []
  new_engines: []

stop_and_escalate:
  - 任一指定模型在本地不可用，且只能通过替换模型继续
  - 任一 worker 需要修改其写入范围之外的文件
  - 任一 worker 修改 canonical 或依赖禁读材料
  - 修复需要新增 schema、关系类型或状态机
  - 并行分支无法在不改变领域语义的情况下集成
  - 机器门失败且修复会扩大工作包
  - 复核需要登录、验证码、付费来源或绕过访问控制
