  - 能力明细不再把过程型判定串冒充证据等级，且不把粗粒度 cell overlap 表述成产品/路线能力
  - 海外输出显式区分 slot/source/claim/reviewed/event 覆盖及 asserted/corroborated
  - 出货量、锚点和关系边的页面展示明确不可比范围与证据边界
  - 九页前端的审计与状态区说明当前可回答、不可回答和证据限制
  - docs/plans/2026-09-04-lights-out-remediation-outsourcing-plan.md
