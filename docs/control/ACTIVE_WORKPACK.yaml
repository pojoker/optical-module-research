  writable: false
architecture_budget: 无新框架与依赖；手写静态页面。
stop_conditions:
  - 未披露的内部 BOM 或工艺不猜测；完成限定切片后停止扩展。

revision_authorization: 用户指出页面仍难懂，明确允许外部资料补充；继续在同一独立页修订因果解释和图示。
