<g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#223530">
<rect x="166" y="99" width="60" height="46" fill="url(#gold)"/>
<path d="M220 85H531L557 106V171H220Z" fill="#cbd4d0" stroke="#667b70" stroke-width="2"/>
<path d="M220 85l28-19h308l-25 19z" fill="#e6ece8" stroke="#667b70" stroke-width="2"/>
<path d="M531 85l25-19 25 21v65l-24 19v-65z" fill="#8c9e94" stroke="#667b70" stroke-width="2"/>
