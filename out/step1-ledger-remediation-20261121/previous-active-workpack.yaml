non_goals:
  - 暂不补抓缺失链接，不上传投关批次、微信研报、Daily 状态或其他缓存
  - 不改资料源文件、canonical、项目已有分支或公开仓库
canonical_policy:
  writable: false
acceptance_criteria:
  - 交付可重试的 Python 上传脚本和经验证的私有 GitHub 地址
  - 精确去重，排除已匹配 GitHub 副本，保留来源与恢复路径并标注转制格式
  - 分包发布，重新下载，对包及包内文件逐一校验 SHA-256
stop_conditions:
  - 归档目标不是指定私有仓库、发现候选范围漂移、原件不可读或上传校验失败时暂停相应操作
